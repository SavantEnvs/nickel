[package]
name = "nickel-mayhem-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.nickel-lang-core]
path = "../../core"
default-features = false

[[bin]]
name = "parse_typecheck"
path = "fuzz_targets/parse_typecheck.rs"
test = false
doc = false
bench = false

[[bin]]
name = "eval"
path = "fuzz_targets/eval.rs"
test = false
doc = false
bench = false

# Standalone crate — NOT a member of the upstream root [workspace]. Without this empty table,
# cargo would believe it's part of the ancestor workspace (whose members[] never lists
# mayhem/fuzz) and refuse to build. This also means the build output lands under
# mayhem/fuzz/target/<triple>/release/<bin>, not the repo-root target/.
[workspace]
